name: devbuild

on:
  workflow_dispatch:
  push:
    branches:
    - dev

env:
  SOLUTION_FILE_PATH: .
  BUILD_CONFIGURATION: Release

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025-vs2026

    steps:
    - uses: actions/checkout@v4
      with:
        ref: refs/heads/dev   
    
    - name: Cache vcpkg
      uses: actions/cache@v5
      with:
       path: ~\AppData\Local\vcpkg\archives
       key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
      
    - name: Add MSBuild to PATH
      uses: microsoft/setup-msbuild@v2

    - name: Restore NuGet packages
      working-directory: ${{ github.workspace }}
      run: nuget restore ${{env.SOLUTION_FILE_PATH}}

    - name: vcpkg
      working-directory: ${{ github.workspace }}
      run: vcpkg integrate install

    - name: Build
      working-directory: ${{ github.workspace }}
      run: msbuild /m /p:Platform=x64 /p:Configuration=${{env.BUILD_CONFIGURATION}} ${{env.SOLUTION_FILE_PATH}}

    - name: checkout external component
      uses: actions/checkout@v4
      with:
        repository: sigewinnefish/sigewinne-toolkit-exclusive-component
        token: ${{ secrets.pat }}
        path: sigewinne-toolkit-exclusive-component

    - name: Preparing for Packing
      working-directory: ${{ github.workspace }}
      run: |
            powershell -Command "Copy-Item './x64/Release/App6' './installer/toolkit' -Recurse -Force -Exclude '*.pdb','*.exp','*.lib','*.xbf','*.winmd'"
            powershell -Command "Rename-Item -Path '.\installer\toolkit\App6.exe' -NewName 'toolkit.exe'"
            powershell -Command "Rename-Item -Path '.\installer\toolkit\App6.pri' -NewName 'toolkit.pri'"

    - name: Pack with kachina installer
      working-directory: ${{ github.workspace }}/installer
      run: |
            powershell -Command "Invoke-WebRequest -Uri 'https://github.com/YuehaiTeam/kachina-installer/releases/download/0.4.1/kachina-builder.exe' -OutFile './kachina-builder.exe'"
            ./kachina-builder.exe pack -t installer.png --icon installer.ico -c toolkit.config.json -o toolkit.update.exe
            ./kachina-builder.exe gen -j 8 -i toolkit -m metadata.json -r toolkit -o hashed -t tag -u toolkit.update.exe
            ./kachina-builder.exe pack -t installer.png --icon installer.ico -c toolkit.config.json -m metadata.json -d hashed -o toolkit.Install.exe

    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v5.0.0
      with:
        path: ${{ github.workspace }}\installer\toolkit.Install.exe
